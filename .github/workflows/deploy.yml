name: Deploy to Amazon ECS

# Manual only. Deploys to a live ECS cluster, so it runs on request rather
# than on every commit — a push should not require a running AWS account.
on:
  workflow_dispatch:

# OIDC: GitHub mints a short-lived token that AWS exchanges for temporary
# credentials. id-token: write is what allows the token to be requested.
# Without it the federation step fails, so this is a required permission
# and not an optional hardening step.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: flask-ecs-fargate
  ECS_SERVICE: flask-ecs-service
  ECS_CLUSTER: flask-ecs-cluster
  CONTAINER_NAME: flask-ecs-fargate

jobs:
  # A job-level `if` cannot read the secrets context, so the check for a
  # configured role has to happen inside a job and be published as an output.
  check-config:
    name: Check deploy target is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set. See README - deploying requires an IAM role that trusts this repository via OIDC."
          fi

  deploy:
    name: Build and Deploy
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No access key exists. GitHub presents a signed OIDC token, AWS validates
      # it against a trust policy scoped to this repository, and returns
      # credentials that expire. There is nothing stored to leak or rotate.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-ecs-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push ./app
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition from AWS
        run: |
          aws ecs describe-task-definition \
            --task-definition flask-ecs-fargate \
            --query taskDefinition \
            --region $AWS_REGION > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
